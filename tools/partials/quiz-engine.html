<!--kn:quiz-engine v2-->
<section class="demo" id="qz-root" data-slug="{{SLUG}}" style="margin-top:56px">
 <div class="fig-head"><span class="fig-no" style="background:var(--pen,#3D5A80)">自测</span><span class="fig-title">卷末自测 · 五题全对算毕业</span></div>
 <div style="font-size:13px;color:var(--ink2,#59616E)" id="qz-top"></div>
 <div id="qz-body"></div>
 <div class="dctrl"><button class="btn" id="qz-retry" type="button">↻ 重做本卷</button><span class="hint" id="qz-note"></span></div>
</section>
<style>
#qz-root .qz-i{border:1px solid var(--line,#DDE0D8);border-radius:10px;background:var(--card,#fff);padding:10px 14px;margin:10px 0}
#qz-root .qz-q{font-weight:700;font-size:14.5px;margin-bottom:7px;line-height:1.7}
#qz-root .qz-o{display:block;width:100%;text-align:left;font-size:13.5px;border:1px solid #C7CCC0;border-radius:7px;background:#fff;padding:5px 12px;margin:4px 0;cursor:pointer;font-family:var(--sans,sans-serif);line-height:1.7;transition:all .15s;color:var(--ink,#1E232B)}
#qz-root .qz-o:hover:not(:disabled){border-color:var(--pen,#3D5A80)}
#qz-root .qz-o.right{border-color:var(--teal,#0E7C6B);background:var(--teal-bg,#E8F4F1);font-weight:700}
#qz-root .qz-o.wrong{border-color:var(--warn,#C0392B);background:var(--warn-bg,#FAECE9)}
#qz-root .qz-o:disabled{cursor:default;opacity:.92}
#qz-root .qz-why{display:none;font-size:12.5px;color:var(--ink2,#59616E);margin-top:7px;line-height:1.75;border-top:1px dashed var(--line,#DDE0D8);padding-top:6px}
#qz-root .qz-why.show{display:block}
#qz-root .qz-why a{color:var(--pen,#3D5A80);font-weight:700}
#qz-score{font-family:var(--mono,monospace);font-size:14px;min-height:24px;margin-top:4px}
#qz-score b{font-size:19px;color:var(--pen,#3D5A80)}
</style>
<script>
(function(){
if(window.__KN_QUIZ__)return;window.__KN_QUIZ__=1;
var QB=window.__KN_QUIZ_DATA__||[],root=document.getElementById('qz-root');
var SLUG=root&&root.getAttribute('data-slug')||location.pathname.replace(/^.*\//,'').replace(/\.html$/,'').replace(/-illustrated$/,'');
try{if(QB.length&&root)localStorage.setItem('kn.visit.'+SLUG,String(Date.now()));}catch(e){}
if(!QB.length||!root){if(root)root.style.display='none';return;}
var body=document.getElementById('qz-body'),note=document.getElementById('qz-note'),topEl=document.getElementById('qz-top'),retry=document.getElementById('qz-retry');
function h(t){return document.createElement(t)}
function loadPrev(){try{var r=JSON.parse(localStorage.getItem('kn.quiz.'+SLUG)||'null');return r&&r.best!=null?'历史最好 '+r.best+'/'+(r.total||QB.length)+' · 已答 '+r.tries+' 次':'';}catch(e){return ''}}
function finish(right,wrongIdx){
  var el=document.getElementById('qz-score');
  el.innerHTML='<b>'+right+'/'+QB.length+'</b> '+(right===QB.length?'满分——这张卷的每个知识点你都摸过了':'——答错的题把解析读完，点「回看」把那一讲的相关段落再过一遍。');
  try{var k='kn.quiz.'+SLUG,prev=JSON.parse(localStorage.getItem(k)||'null');
    var rec={right:right,total:QB.length,best:Math.max(right,prev&&prev.best||0),tries:(prev&&prev.tries||0)+1,wrong:wrongIdx,ts:Date.now()};
    localStorage.setItem(k,JSON.stringify(rec));topEl.textContent=loadPrev();}catch(e){}
}
function render(){
  body.innerHTML='';note.textContent='';topEl.textContent=loadPrev();
  var right=0,answered=0,wrongIdx=[];
  var sc=h('div');sc.id='qz-score';body.append(sc);
  QB.forEach(function(item,qi){
    var box=h('div');box.className='qz-i';
    var q=h('div');q.className='qz-q';q.textContent=(qi+1)+'. '+item.q;box.append(q);
    var why=h('div');why.className='qz-why';
    why.textContent='解析：'+item.why+' ';
    var back=h('a');back.textContent='↩ 回看'+(item.rt?(' · '+item.rt):'');back.href=item.ref;why.append(back);
    var btns=[];
    item.o.forEach(function(op,oi){
      var b=h('button');b.type='button';b.className='qz-o';b.textContent=String.fromCharCode(65+oi)+'. '+op;
      b.onclick=function(){
        if(box.dataset.done)return;box.dataset.done='1';answered++;
        var ok=oi===item.a;if(ok)right++;else wrongIdx.push(qi+1);
        b.classList.add(ok?'right':'wrong');
        btns[item.a].classList.add('right');
        btns.forEach(function(x){x.disabled=true});
        why.classList.add('show');
        if(answered===QB.length)finish(right,wrongIdx);
      };
      btns.push(b);box.append(b);
    });
    box.append(why);body.append(box);
  });
}
retry.onclick=function(){render()};
render();
})();
</script><!--/kn:quiz-engine-->
